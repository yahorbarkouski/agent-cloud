name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: agentcloud
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U agentcloud -d agentcloud"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm exec --yes --package=pnpm@12.3.4 -- pnpm install --frozen-lockfile
      - run: npm exec --yes --package=pnpm@12.3.4 -- pnpm check
      - run: npm exec --yes --package=pnpm@12.3.4 -- pnpm format:check
