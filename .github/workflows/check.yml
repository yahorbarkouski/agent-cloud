name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_checks: ${{ steps.changes.outputs.run_checks }}
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/check-scope.sh
  check:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result == 'failure' || needs.scope.outputs.run_checks == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: ${{ needs.scope.outputs.code_changed == 'true' && 'postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73' || '' }}
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: agentcloud
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U agentcloud -d agentcloud"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.scope.outputs.code_changed == 'false'
        run: npm exec --yes --package=prettier@3.8.3 -- prettier --check .
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm install --frozen-lockfile
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm check
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm format:check
      - if: needs.scope.outputs.code_changed == 'true'
        timeout-minutes: 5
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:self-host-restore
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:usage
      - if: needs.scope.outputs.code_changed == 'true'
        timeout-minutes: 5
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:recipes
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:cleanup
      - if: needs.scope.outputs.code_changed == 'true'
        timeout-minutes: 6
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:backup-store
      - if: needs.scope.outputs.code_changed == 'true'
        timeout-minutes: 3
        run: |
          npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:backup-retention
          npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:backup-recovery
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm setup:step
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm setup:pki
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm pki:up
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:pki
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:gateway-pki
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:ssh
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:customer-pki
      - if: needs.scope.outputs.code_changed == 'true'
        run: npm exec --yes --package=pnpm@12.3.4 -- pnpm smoke:enrollment
      - if: always() && needs.scope.outputs.code_changed == 'true'
        run: |
          if [ -f .local/pki/compose.env ]; then
            npm exec --yes --package=pnpm@12.3.4 -- pnpm pki:down
          fi
