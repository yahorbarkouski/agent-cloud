name: Release CLI
on:
  push:
    tags: ['cli-v*']
permissions:
  contents: read
concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Require a checked source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('apps/cli/package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/);
          assert.equal(process.env.GITHUB_REF_NAME, `cli-v${version}`);
          JS
          checked=false
          for run in $(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs" \
            -f "head_sha=$GITHUB_SHA" -f status=completed -f per_page=100 \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .event == "push") | .id'); do
            if [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq 'any(.jobs[]; .name == "check" and .conclusion == "success" and any(.steps[]; .name == "Validate source" and .conclusion == "success") and any(.steps[]; .name == "Exercise CLI archive" and .conclusion == "success"))') == true ]]; then
              checked=true
              break
            fi
          done
          [[ "$checked" == true ]] || { echo 'A successful Check job on this exact source revision is required.' >&2; exit 1; }
      - name: Scan tracked history before distribution
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --no-banner
      - run: npm exec --yes --package=pnpm@12.3.4 -- pnpm install --frozen-lockfile
      - name: Build and exercise the release archive
        run: |
          set -euo pipefail
          npm exec --yes --package=pnpm@12.3.4 -- pnpm release:cli --output "$RUNNER_TEMP/cli-release"
          cd "$RUNNER_TEMP/cli-release"
          sha256sum --check SHA256SUMS
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" \
            '.workingTreeDirty == false and .sourceRevision == $sha and ("cli-v" + .cliVersion) == $tag' release.json
          archive=$(jq -r .archive release.json)
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cli="$RUNNER_TEMP/${archive%.tar.gz}/bin/acld"
          [[ $("$cli" --version) == $(jq -r .cliVersion release.json) ]]
          "$cli" agent instructions > "$RUNNER_TEMP/release-instructions.json"
          "$cli" recipe list > "$RUNNER_TEMP/release-recipes.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-release-${{ github.sha }}
          path: ${{ runner.temp }}/cli-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      # No dependency install or packaged code execution in the signing/publishing job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-release-${{ github.sha }}
          path: ${{ runner.temp }}/cli-release
      - name: Check archive identity
        working-directory: ${{ runner.temp }}/cli-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" \
            '.workingTreeDirty == false and .sourceRevision == $sha and ("cli-v" + .cliVersion) == $tag and .archive == ("agent-cloud-cli-" + .cliVersion + ".tar.gz")' release.json
          [[ $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha) == "$GITHUB_SHA" ]]
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/cli-release/*
      - name: Verify provenance and publish a complete preview
        working-directory: ${{ runner.temp }}/cli-release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          archive=$(jq -r .archive release.json)
          cp "$PROVENANCE_BUNDLE" provenance.jsonl
          for subject in "$archive" release.json SHA256SUMS; do
            gh attestation verify "$subject" --bundle provenance.jsonl --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-cli.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Developer preview of the standalone agent-cloud CLI, including PostgreSQL and Umami recipes and instructions for existing agents.

          Verify the GitHub build attestation and checksums before extracting. Installation instructions are in docs/cli-install.md at this release's source revision.

          The control service requires operator configuration and customer admission. Final public ACME and protected Hetzner storage verification remain pending. This release does not provision infrastructure when downloaded or installed.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$archive" release.json SHA256SUMS provenance.jsonl \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --draft --prerelease \
            --title "agent-cloud CLI ${GITHUB_REF_NAME#cli-v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          [[ $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha) == "$GITHUB_SHA" ]]
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
